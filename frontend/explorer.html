<!doctype html>
<html><head><meta charset="utf-8"><title>NozeOmics sample explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#213047;font:14px Arial,sans-serif}
.nz-app{padding:16px;max-width:100%;min-width:720px}.nz-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.nz-head h2{font-size:20px;margin:0}.nz-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nz-btn{border:1px solid #b7c7db;border-radius:7px;background:#fff;color:#18324d;padding:7px 10px;cursor:pointer;font-size:12px}
.nz-btn:hover{background:#e8f2fc}.nz-layout{display:grid;grid-template-columns:260px minmax(560px,1fr) 220px;gap:12px;min-height:630px}
.nz-stat-controls{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid #e6edf5;flex-wrap:wrap}.nz-stat-controls .nz-btn{flex:1;white-space:nowrap}.nz-stat-badge{border-radius:999px;padding:5px 9px;background:#eef2f6;color:#5f6f80;font-size:12px;font-weight:bold}.nz-stat-badge.recalculated{background:#dff4e5;color:#237a3b}.nz-stat-badge.outdated{background:#fff0d6;color:#a55d00}.nz-stat-badge.running{background:#e2efff;color:#1764aa}
.nz-side,.nz-main,.nz-gene-side{background:#fff;border:1px solid #d9e2ed;border-radius:10px;min-width:0}
.nz-side{height:630px;overflow:hidden;padding:0;display:flex;flex-direction:column}.nz-side-list{padding:12px;overflow:auto;min-height:0;flex:1}.nz-main{height:630px;padding:12px;position:relative;display:flex;flex-direction:column}
.nz-gene-side{height:630px;padding:12px;display:flex;flex-direction:column}.nz-gene-title{font-size:13px;font-weight:bold;color:#30465e;padding:1px 2px 9px;border-bottom:1px solid #e6edf5}.nz-gene-list{overflow:auto;min-height:0;padding-top:6px}.nz-gene-row{display:flex;align-items:center;gap:7px;padding:4px 3px;font-size:12px;white-space:nowrap;transition:opacity .12s,background .12s}.nz-gene-row:hover,.nz-gene-row.nz-active{background:#e7f2ff;border-radius:5px;font-weight:bold}.nz-gene-row.nz-dim{opacity:.22}.nz-gene-row span{overflow:hidden;text-overflow:ellipsis}.nz-gene-row input{margin:0;flex:none}.nz-gene-toggle{display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:default}.nz-gene-toggle span{min-width:0}
.nz-note{font-size:12px;color:#5d6e83;margin:0 0 10px}.nz-dataset{padding:9px 0;border-top:1px solid #e6edf5}
.nz-dataset-head{display:flex;gap:7px;align-items:center;flex-wrap:nowrap}.nz-dataset-toggle{display:flex;align-items:center;gap:7px;flex:1;min-width:0;cursor:default}.nz-disclosure{border:0;background:transparent;color:#42566d;padding:0;width:16px;cursor:pointer}.nz-color{width:10px;height:10px;border-radius:50%;flex:none}.nz-gse-toggle{margin:0;flex:none}.nz-show-type{display:flex;align-items:center;gap:7px;padding:0 0 10px;font-size:12px;color:#42566d}.nz-show-type select{border:1px solid #b7c7db;border-radius:6px;background:#fff;color:#18324d;padding:5px 7px}
.nz-dataset strong{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nz-group{font-size:12px;color:#65758a;margin:9px 0 4px 3px;font-weight:bold}
.nz-sample{display:flex;align-items:center;gap:5px;padding:3px 0 3px 10px;font-size:12px;white-space:nowrap}
.nz-sample .nz-sample-name{overflow:hidden;text-overflow:ellipsis}.nz-sample{transition:opacity .12s,background .12s}.nz-sample.nz-dim{opacity:.18}.nz-sample.nz-active{background:#e7f2ff;border-radius:5px;font-weight:bold}.nz-sample.nz-excluded input{position:absolute;opacity:0;pointer-events:none}.nz-excluded-check{width:14px;height:14px;border:1.5px solid #c62828;border-radius:3px;color:#c62828;background:#fff;display:inline-grid;place-items:center;line-height:11px;font-size:14px;font-weight:bold;flex:none}.nz-scroll{width:100%;flex:1;min-height:0;overflow-x:auto;overflow-y:hidden;position:relative}.nz-y-axis{position:absolute;z-index:8;left:12px;top:12px;width:76px;height:555px;background:linear-gradient(90deg,#fff 0%,#fff 88%,rgba(255,255,255,.92) 94%,rgba(255,255,255,0) 100%);pointer-events:none}.nz-y-axis svg{display:block}
.nz-graph{position:relative;min-height:540px}.nz-graph svg{display:block}.nz-tooltip{position:absolute;z-index:10;pointer-events:none;display:none;background:#183047;color:#fff;border-radius:6px;padding:7px 9px;font-size:12px;line-height:1.5;box-shadow:0 2px 12px #0003;white-space:nowrap}
.nz-footer{border-top:1px solid #e6edf5;margin-top:8px;padding-top:8px;color:#52657e;font-size:12px}
.nz-bottom-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #e6edf5;padding-top:8px;margin-top:8px}.nz-filter,.nz-cutoff{display:flex;align-items:center;gap:5px;font-size:12px;color:#42566d;white-space:nowrap}.nz-significance-controls{display:flex;align-items:center;gap:10px;margin-left:auto}.nz-metric-toggle{min-width:94px;font-weight:bold}.nz-cutoff{margin:0}.nz-cutoff input{width:140px;accent-color:#2563a5}.nz-cutoff output{min-width:32px;text-align:right;font-weight:bold;color:#244d73}.nz-step{padding:3px 7px;font-weight:bold}
.nz-warning{color:#c62828;font-weight:bold}.nz-status{font-size:12px;color:#50657b}.nz-tip-warning{color:#ff9b9b;font-weight:bold}
 .nz-graph-types{padding:12px;border-bottom:1px solid #e6edf5}.nz-section-label{font-size:12px;font-weight:bold;color:#42566d;margin-bottom:7px}.nz-graph-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.nz-graph-option{border:1px solid #b7c7db;border-radius:8px;background:#fff;cursor:pointer;padding:7px 4px;color:#30465e;font-size:12px;text-align:center}.nz-graph-option.active{border:2px solid #2563a5;background:#eaf4ff;font-weight:bold;padding:6px 3px}.nz-graph-option svg{display:block;margin:0 auto 5px;width:70px;height:48px}.nz-side-show{padding:10px 12px;border-bottom:1px solid #e6edf5}.nz-side-show select{width:100%}.nz-heatmap-view{display:none;width:100%;height:100%;overflow:auto;padding:4px;color:#607086;font-size:12px}.nz-heatmap-view svg{display:block}.nz-ma-view{display:none;width:100%;height:100%;position:relative}.nz-ma-canvas{display:block;width:100%;height:100%;cursor:default}.nz-ma-canvas.dragging{cursor:default}.nz-ma-tip{position:absolute;display:none;pointer-events:none;background:#183047;color:#fff;border-radius:6px;padding:7px 9px;font-size:12px;line-height:1.5;white-space:nowrap;z-index:10;box-shadow:0 2px 12px #0003}.nz-ma-note{font-size:11px;color:#5d6e83;margin:0}.nz-right-significance{margin-top:auto;border-top:1px solid #e6edf5;padding-top:10px;display:flex;flex-direction:column;gap:8px}.nz-right-significance .nz-cutoff{flex-wrap:wrap}.nz-right-significance .nz-cutoff input{width:100%;order:4}.nz-right-significance .nz-filter{white-space:normal}.nz-right-significance .nz-metric-toggle{width:100%}.nz-ma-unsupported{display:none;font-size:11px;color:#b45309;padding:5px 12px}.nz-ma-disabled-note{font-size:11px;color:#b45309;padding:4px 0 0 23px}.nz-main{overflow:hidden}.nz-ma-status{display:none;font-size:11px;color:#607086;padding:8px 12px;border-top:1px solid #e6edf5;line-height:1.5;flex:none}.nz-gene-list{flex:1}.nz-gene-all{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e6edf5;font-weight:bold}.nz-gene-row[draggable="true"]{cursor:default}.nz-gene-row.nz-drag-over{outline:2px solid #4b92d0;border-radius:4px}.nz-gene-remove{margin-left:auto;border:0;background:transparent;color:#a33d3d;font-size:17px;line-height:1;cursor:default;opacity:0;padding:2px 6px}.nz-gene-row:hover .nz-gene-remove,.nz-gene-row:focus-within .nz-gene-remove{opacity:1}.nz-gene-remove:hover,.nz-gene-remove:focus-visible{color:#fff;background:#b42332;border-radius:5px;box-shadow:0 0 0 2px #ffd4d8;outline:none}.nz-ma-gene-search{display:none;gap:5px;padding:8px 0;border-bottom:1px solid #e6edf5}.nz-ma-gene-search input{min-width:0;width:100%;border:1px solid #b7c7db;border-radius:5px;padding:6px;font-size:12px}.nz-ma-gene-search button{padding:5px 7px}.nz-toast{position:absolute;right:24px;top:14px;z-index:30;background:#253c54;color:#fff;padding:8px 12px;border-radius:7px;font-size:12px;box-shadow:0 3px 12px #0003;display:none}
.nz-heatmap-stage{width:max-content;min-height:100%;margin:auto;display:flex;flex-direction:column;justify-content:center}
@media(max-width:1050px){.nz-layout{grid-template-columns:210px minmax(500px,1fr) 195px}}

.nz-graph-options{grid-template-columns:repeat(2,minmax(0,1fr))}.nz-layout{min-height:0}.nz-side,.nz-main,.nz-gene-side{height:calc(100vh - 68px);min-height:620px}.nz-app{padding:12px 16px}.nz-pca-view{height:100%;display:none;position:relative}.nz-pca-canvas{width:100%;height:100%;display:block;cursor:default}.nz-pca-settings{display:none;padding:8px 12px;border-bottom:1px solid #e6edf5;font-size:12px}.nz-pca-settings select{max-width:100%;font-size:12px}.nz-gene-row.selected{background:#e7f2ff}.nz-sample.nz-excluded input{position:static;opacity:1;pointer-events:auto}
</style><link rel="stylesheet" href="capabilities.css"></head><body>
<div class="nz-app" id="nz-root"><div class="nz-head"><h2 id="nz-comparison-name">Expression explorer</h2></div>
<div class="nz-layout" id="nz-layout"><aside class="nz-side"><div class="nz-graph-types"><div class="nz-section-label">Graph type</div><div class="nz-graph-options"><button type="button" class="nz-graph-option" id="nz-graph-pca" aria-pressed="false"><svg viewBox="0 0 85 48" aria-hidden="true"><path d="M5 42H80M5 5V42" fill="none" stroke="#9aafc3"/><g fill="#2563a5"><circle cx="22" cy="30" r="3"/><circle cx="27" cy="34" r="3"/><circle cx="33" cy="29" r="3"/></g><g fill="#dc6b26"><circle cx="56" cy="16" r="3"/><circle cx="64" cy="21" r="3"/><circle cx="69" cy="13" r="3"/></g></svg>PCA</button><button type="button" class="nz-graph-option" id="nz-graph-ma" aria-pressed="false"><svg viewBox="0 0 85 48" aria-hidden="true"><path d="M5 42H80M5 5V42M5 24H80" fill="none" stroke="#9aafc3"/><g fill="#2563a5"><circle cx="17" cy="12" r="2.5"/><circle cx="20" cy="33" r="2"/><circle cx="30" cy="22" r="2"/><circle cx="40" cy="16" r="2.5"/><circle cx="45" cy="29" r="2.5"/><circle cx="56" cy="25" r="2"/><circle cx="67" cy="21" r="2.5"/><circle cx="72" cy="26" r="2"/></g></svg>MA plot</button><div class="nz-trend-choice"><button type="button" class="nz-graph-option active" id="nz-graph-trend" aria-pressed="true"><svg viewBox="0 0 85 48" aria-hidden="true"><path d="M5 42H80M5 5V42" fill="none" stroke="#9aafc3"/><polyline points="9,31 24,26 39,34 55,15 75,20" fill="none" stroke="#2563a5" stroke-width="3"/><circle cx="24" cy="26" r="3" fill="#2563a5"/><circle cx="55" cy="15" r="3" fill="#2563a5"/></svg>Trend</button><div class="nz-trend-bookmarks" id="nz-trend-bookmarks"><button type="button" data-show-type="mean">Trend</button><button type="button" data-show-type="points">Individual</button><button type="button" data-show-type="both">Both</button></div></div><button type="button" class="nz-graph-option" id="nz-graph-heatmap" aria-pressed="false"><svg viewBox="0 0 85 48" aria-hidden="true"><g transform="translate(4 0)"><path d="M5 5H80M5 5V43" fill="none" stroke="#9aafc3"/><g stroke="#fff" stroke-width="1"><path fill="#4c81ac" d="M12 11h17v14H12zM30 11h17v14H30zM48 11h17v14H48z"/><path fill="#f1bb75" d="M12 26h17v14H12zM30 26h17v14H30z"/><path fill="#df5a42" d="M48 26h17v14H48z"/></g></g></svg>Heatmap</button><button type="button" class="nz-graph-option" id="nz-graph-pathway" aria-pressed="false"><svg viewBox="0 0 85 48" aria-hidden="true"><g fill="none" stroke="#8ca4ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 24H39M46 24H66M42 20V10H62M42 28V38H62"/></g><g fill="#eaf4ff" stroke="#427ca9" stroke-width="1.7"><rect x="7" y="17" width="16" height="14" rx="4"/><rect x="34" y="17" width="16" height="14" rx="4"/><rect x="63" y="17" width="15" height="14" rx="4"/><rect x="62" y="5" width="13" height="10" rx="3"/><rect x="62" y="33" width="13" height="10" rx="3"/></g><path d="m28 21 3 3-3 3m29-6 3 3-3 3" fill="none" stroke="#427ca9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>Pathway</button></div></div><div class="nz-side-show nz-show-type" id="nz-side-show"><label>Show type: <select id="nz-show-type-select"><option value="both">Both</option><option value="points">Individual</option><option value="mean" selected>Trend</option></select></label></div><div class="nz-ma-unsupported" id="nz-ma-unsupported"></div><div class="nz-side-list" id="nz-side"></div><div class="nz-stat-controls"><span class="nz-stat-badge" id="nz-stat-badge">Original</span><button class="nz-btn" id="nz-recalculate">Significance recalculate</button></div></aside><main class="nz-main"><div class="nz-panel-toolbar"><button id="nz-toggle-left" type="button" title="Hide left panel" aria-label="Hide left panel">◀</button><button id="nz-toggle-right" type="button" title="Hide right panel" aria-label="Hide right panel">▶</button></div><div id="nz-pathway-view" class="nz-pathway-view"><p>Pathway visualization is planned for a future update.</p></div><div class="nz-y-axis" id="nz-y-axis"></div><div class="nz-scroll" id="nz-scroll"><div class="nz-graph" id="nz-graph"></div></div><div class="nz-heatmap-view" id="nz-heatmap-view"></div><div class="nz-ma-view" id="nz-ma-view"><canvas class="nz-ma-canvas" id="nz-ma-canvas" width="1100" height="600"></canvas><div class="nz-ma-tip" id="nz-ma-tip"></div></div><div class="nz-pca-view" id="nz-pca-view"><div class="nz-pca-settings" id="nz-pca-settings"><select id="nz-pca-top" aria-label="Genes used for PCA"><option value="500">Most variable 500</option><option value="1000">Most variable 1000</option><option value="2000">Most variable 2000</option><option value="0">All eligible genes</option></select><label class="nz-pca-label-toggle"><input id="nz-pca-names" type="checkbox">GSM name</label><button class="nz-btn" id="nz-pca-run" hidden>Calculate PCA</button></div><div class="nz-pca-legend"><div id="nz-pca-control-legend"></div><div id="nz-pca-treated-legend"></div></div><canvas class="nz-pca-canvas" id="nz-pca-canvas"></canvas><div class="nz-ma-tip" id="nz-pca-tip"></div></div><div id="nz-footer" style="display:none"></div></main><aside class="nz-gene-side"><div class="nz-gene-title" id="nz-gene-title">Genes</div><div class="nz-gene-list" id="nz-gene-list"></div><div class="nz-ma-gene-search" id="nz-ma-gene-search"><input id="nz-ma-gene-query" type="search" placeholder="Exact gene name" aria-label="Find gene in MA plot"><button class="nz-btn" id="nz-ma-gene-find" type="button" title="Find gene">⌕</button></div><div class="nz-right-significance"><div class="nz-section-label">Significance</div><div class="nz-significance-row"><button class="nz-btn nz-metric-toggle" id="nz-significance-toggle" type="button">adj.P.Val</button><div class="nz-cutoff-steps"></div></div><label class="nz-cutoff"><button class="nz-btn nz-step" id="nz-cutoff-minus" type="button">−</button><output id="nz-cutoff-value">0.05</output><button class="nz-btn nz-step" id="nz-cutoff-plus" type="button">+</button><input type="range" id="nz-cutoff" min="0" max="13" step="1" value="4"></label><label class="nz-filter" id="nz-hide-filter"><input type="checkbox" id="nz-hide-nonsig"><span id="nz-hide-label">Hide genes with adj.P.Val above cutoff</span></label><div class="nz-ma-status" id="nz-ma-status"></div></div></aside></div><div class="nz-toast" id="nz-toast" role="status" aria-live="polite"></div></div>
